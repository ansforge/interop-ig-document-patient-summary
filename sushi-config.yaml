groups:
  Modèles logiques métier IPS:
    name: Modèles logiques métier d'un document IPS
    resources:
      - StructureDefinition/fr-lm-patient-summary-document
  
  Ressources CDA IPS:
    name: Eléments CDA d'un document IPS
    resources:
      - StructureDefinition/fr-cda-clinical-document-ips

